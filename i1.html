<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Airbnb Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <!-- Modal Box -->
    <div class="bg-white rounded-2xl shadow-xl p-8 w-full max-w-sm">

        <!-- Logo -->
        <div class="flex justify-center mb-4">
            <svg width="40" height="40" viewBox="0 0 30 32" fill="#FF385C">
                <path d="M15 0C9 8 3 13 3 19a12 12 0 0024 0C27 13 21 8 15 0z" />
            </svg>
        </div>

        <!-- Title -->
        <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">
            Log in or sign up
        </h2>

        <!-- Input -->
        <input type="text" placeholder="Phone number or email"
            class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-gray-500 mb-4" />

        <!-- Continue Button -->
        <button class="w-full bg-[#FF385C] text-white font-semibold py-3 rounded-xl hover:bg-[#e0284f] transition">
            Continue
        </button>

        <!-- Divider -->
        <div class="flex items-center gap-3 my-4">
            <div class="flex-1 h-px bg-gray-300"></div>
            <span class="text-sm text-gray-500">or</span>
            <div class="flex-1 h-px bg-gray-300"></div>
        </div>

        <!-- Google Button -->
        <button class="w-full flex items-center justify-center gap-3 border border-gray-300 rounded-xl py-3 hover:bg-gray-50 transition mb-3">
            <img src="https://www.google.com/favicon.ico" class="w-5 h-5" />
            <span class="text-sm font-semibold text-gray-700">Continue with Google</span>
        </button>

        <!-- Apple Button -->
        <button class="w-full flex items-center justify-center gap-3 border border-gray-300 rounded-xl py-3 hover:bg-gray-50 transition">
            <span class="text-xl">🍎</span>
            <span class="text-sm font-semibold text-gray-700">Continue with Apple</span>
        </button>

    </div>

</body>
</html>
